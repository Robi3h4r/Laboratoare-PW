<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofoliu Robert</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>Hopulele Robert</h1>
        <p id="salut-header">Se încarcă salutul...</p>
    </header>

    <nav>
        <ul>
            <li><a href="#about">Despre</a></li>
            <li><a href="#education">Educație</a></li>
            <li><button id="theme-toggle">🌙 Dark Mode</button></li>
        </ul>
    </nav>

    <main>
        <section id="about" class="card">
            <h2>Cine sunt eu?</h2>
            <img src="images.webp" alt="Profil" class="profile-img">
            <p>Salut! Acesta este portofoliul meu creat pentru laboratorul de PW.</p>
        </section>

        <section id="education" class="card">
            <h2>Educație</h2>
            <ul>
                <li><strong>2019 - 2024:</strong> Liceul Mihai Viteazu</li>
                <li><strong>2024 - Prezent:</strong> Facultatea de Inginerie, UniTBv</li>
            </ul>
        </section>

        <section id="contact" class="card">
            <h2>Contact</h2>
            <form id="contact-form">
                <label>Nume:</label><br>
                <input type="text" id="name"><br><br>
                <label>Email:</label><br>
                <input type="email" id="email"><br><br>
                <label>Mesaj:</label><br>
                <textarea id="message"></textarea><br><br>
                <button type="submit">Trimite Mesaj</button>
                <p id="feedback-message"></p>
            </form>
        </section>
    </main>

    <script src="js/contact_forms.js"></script>
    <script src ="js/array.js"></script>
</body>
</html>
